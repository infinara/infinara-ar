<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Infinara</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #0b0b0b; color: #eee; text-align: center; padding: 24px;
  }
  #start h1 { font-weight: 300; letter-spacing: .3em; font-size: 22px; margin: 0 0 12px; text-transform: uppercase; }
  #start p { font-size: 14px; color: #aaa; max-width: 280px; line-height: 1.5; margin: 0 0 28px; }
  button {
    background: none; border: 1px solid #eee; color: #eee; padding: 12px 28px; font-size: 14px;
    letter-spacing: .15em; text-transform: uppercase; border-radius: 0; cursor: pointer;
  }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 28px; z-index: 5; text-align: center; color: #fff;
    font-size: 13px; letter-spacing: .1em; opacity: .85; pointer-events: none; display: none; text-shadow: 0 0 6px #000;
  }
  #sound {
    position: fixed; top: 16px; right: 16px; z-index: 6; display: none; padding: 8px 14px; font-size: 12px;
    background: rgba(0,0,0,.4);
  }
  #error { color: #e88; font-size: 13px; margin-top: 18px; max-width: 280px; }
  #scene-holder { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
  .mindar-ui-overlay, .a-enter-vr, .a-enter-ar { display: none !important; }
</style>
</head>
<body>
<div id="start">
  <h1>Infinara</h1>
  <p>Allow camera access, then point your phone at the photo.</p>
  <button id="go">Start</button>
  <div id="error"></div>
</div>
<div id="hint">Point at the photo</div>
<button id="sound">Sound off</button>
<div id="scene-holder"></div>

<script>
(async function () {
  const startEl = document.getElementById('start');
  const errEl = document.getElementById('error');
  const hint = document.getElementById('hint');
  const soundBtn = document.getElementById('sound');
  const holder = document.getElementById('scene-holder');

  const config = await (await fetch('config.json', { cache: 'no-cache' })).json();

  // Floating look. All sizes are relative to the photo width (= 1).
  const fl = Object.assign({ width: 0.87, lift: 0.04, bob: 0.008, shadow: true }, config.float || {});
  const photoAspect = config.photoAspect || 0.698; // photo height / width
  // Tracking smoothness. Lower filterMinCF / filterBeta = steadier but slower to follow.
  const tr = Object.assign({ filterMinCF: 0.001, filterBeta: 100, warmupTolerance: 5, missTolerance: 10 }, config.tracking || {});

  // Extra smoothing on top of MindAR: holds still through small jitter, follows quickly when the phone really moves.
  const sm = Object.assign({ noise: 0.015, tauRest: 0.4, tauMove: 0.05 }, config.smooth || {});
  AFRAME.registerComponent('smooth-follow', {
    schema: { targetId: { type: 'string' }, noise: { default: 0.015 }, tauRest: { default: 0.4 }, tauMove: { default: 0.05 } },
    init() {
      this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3();
      this.ps = new THREE.Vector3(); this.qs = new THREE.Quaternion(); this.have = false; this.tg = null;
    },
    tick(t, dtms) {
      if (!this.tg) this.tg = document.getElementById(this.data.targetId);
      if (!this.tg) return;
      const src = this.tg.object3D, me = this.el.object3D, d = this.data;
      if (!src.visible) { me.visible = false; this.have = false; return; }
      src.matrix.decompose(this.p, this.q, this.s);
      const dt = Math.min((dtms || 16) / 1000, 0.1);
      if (!this.have) { this.ps.copy(this.p); this.qs.copy(this.q); this.have = true; }
      else {
        const dev = this.ps.distanceTo(this.p) + 0.5 * this.qs.angleTo(this.q);
        const tau = d.tauMove + (d.tauRest - d.tauMove) * Math.exp(-Math.pow(dev / d.noise, 2));
        const a = 1 - Math.exp(-dt / tau);
        if (!isFinite(a)) { this.have = false; return; }
        this.ps.lerp(this.p, a); this.qs.slerp(this.q, a);
      }
      if (!isFinite(this.ps.x + this.ps.y + this.ps.z)) { this.have = false; return; }
      me.position.copy(this.ps); me.quaternion.copy(this.qs); me.scale.copy(this.s); me.visible = true;
    }
  });

  // Soft drop shadow texture (drawn once, no image file needed)
  function shadowTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    x.shadowColor = 'rgba(0,0,0,0.9)'; x.shadowBlur = 28; x.shadowOffsetX = 1000;
    x.fillStyle = '#000';
    x.fillRect(40 - 1000, 40, 176, 176);
    return c.toDataURL('image/png');
  }
  const shadowSrc = fl.shadow ? shadowTexture() : '';

  // One shared <video>: only the video for the scanned card is downloaded.
  const vid = document.createElement('video');
  vid.setAttribute('playsinline', ''); vid.setAttribute('webkit-playsinline', '');
  vid.setAttribute('crossorigin', 'anonymous');
  vid.loop = true; vid.muted = true; vid.preload = 'metadata';
  vid.style.display = 'none';
  document.body.appendChild(vid);

  let entities = '';
  config.targets.forEach((t, i) => {
    const w = fl.width, h = fl.width * t.videoAspect;
    const sw = w * 1.22, sh = h * 1.22;
    entities += `
      <a-entity mindar-image-target="targetIndex: ${i}" id="t${i}"></a-entity>
      <a-entity id="s${i}" visible="true" smooth-follow="targetId: t${i}; noise: ${sm.noise}; tauRest: ${sm.tauRest}; tauMove: ${sm.tauMove}">
        ${fl.shadow ? `<a-plane id="sh${i}" position="0.012 -0.022 0.004" width="${sw}" height="${sh}"></a-plane>` : ''}
        <a-entity position="0 0 ${fl.lift}"
          animation="property: position; to: 0 0 ${fl.lift + fl.bob}; dir: alternate; dur: 2800; easing: easeInOutSine; loop: true">
          <a-plane id="v${i}" width="${w}" height="${h}" visible="false" material="shader: flat; color: #ffffff"></a-plane>
        </a-entity>
      </a-entity>`;
  });

  holder.innerHTML = `
    <a-scene mindar-image="imageTargetSrc: ${config.mindFile}; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: ${tr.filterMinCF}; filterBeta: ${tr.filterBeta}; warmupTolerance: ${tr.warmupTolerance}; missTolerance: ${tr.missTolerance};"
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${entities}
    </a-scene>`;

  const sceneEl = holder.querySelector('a-scene');
  if (!sceneEl.hasLoaded) await new Promise(r => sceneEl.addEventListener('loaded', r, { once: true }));

  // Shadow material (set as an object: a data URL breaks A-Frame's string parser)
  if (fl.shadow) config.targets.forEach((t, i) => {
    document.getElementById('sh' + i).setAttribute('material',
      { shader: 'flat', src: shadowSrc, transparent: true, opacity: 0.55, depthWrite: false });
  });

  // Video texture shared by every video plane
  const tex = new THREE.VideoTexture(vid);
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;

  const planes = config.targets.map((t, i) => document.getElementById('v' + i));
  planes.forEach(p => {
    const apply = () => {
      const mesh = p.getObject3D('mesh');
      if (!mesh) return;
      mesh.material.map = tex; mesh.material.needsUpdate = true;
    };
    if (p.getObject3D('mesh')) apply();
    else p.addEventListener('object3dset', e => { if (e.detail.type === 'mesh') apply(); });
  });

  // Camera: MindAR asks for the default camera at low resolution (blurry, and iPhone Pro may pick the ultra-wide / macro lens).
  // Ask for 1280x720 and, where the phone names its lenses, the plain main back camera.
  const mdev = navigator.mediaDevices, origGUM = mdev.getUserMedia.bind(mdev);
  let backId = null;
  mdev.getUserMedia = async (c) => {
    if (c && c.video && typeof c.video === 'object' && c.video.facingMode) {
      const v = Object.assign({}, c.video, { width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: 'continuous' }] });
      if (backId) { v.deviceId = { exact: backId }; delete v.facingMode; }
      try { return await origGUM(Object.assign({}, c, { video: v })); } catch (e) { console.warn('camera constraints rejected, using defaults', e); }
    }
    return origGUM(c);
  };
  async function pickBackCamera() {
    try {
      const tmp = await origGUM({ video: { facingMode: 'environment' } });   // permission prompt; labels appear after this
      tmp.getTracks().forEach(t => t.stop());
      const cams = (await mdev.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const main = cams.find(d => /^back camera$/i.test(d.label)) ||
                   cams.find(d => /back/i.test(d.label) && !/ultra|wide|tele|dual|triple|macro/i.test(d.label));
      return main ? main.deviceId : null;
    } catch (e) { return null; }
  }

  let soundOn = false, current = -1;
  function applySound() { vid.muted = !soundOn; soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; }

  function showCurrent(on) {
    planes.forEach((p, i) => p.setAttribute('visible', on && i === current));
  }
  vid.addEventListener('playing', () => { if (current < 0) return; hint.style.display = 'none'; showCurrent(true); });

  const goBtn = document.getElementById('go'), startMsg = document.querySelector('#start p');
  goBtn.addEventListener('click', async () => {
    errEl.textContent = '';
    goBtn.disabled = true; goBtn.textContent = 'Loading…'; startMsg.textContent = 'Starting the camera. This can take a few seconds the first time.';
    try {
      // Unlock video playback inside the tap (iOS). Uses a tiny 1 KB clip, so nothing big is downloaded yet.
      vid.muted = true; vid.src = 'videos/unlock.mp4'; current = -1;
      try { await vid.play(); vid.pause(); } catch (e) {}
      backId = await pickBackCamera();
      await sceneEl.systems['mindar-image-system'].start();
      startEl.style.display = 'none';
      hint.style.display = 'block';
      soundBtn.style.display = 'block';
    } catch (e) {
      goBtn.disabled = false; goBtn.textContent = 'Start'; startMsg.textContent = 'Allow camera access, then point your phone at the photo.';
      errEl.textContent = 'Could not open the camera. Check browser permissions and try again.';
      console.error(e);
    }
  });

  soundBtn.addEventListener('click', () => { soundOn = !soundOn; applySound(); });

  config.targets.forEach((t, i) => {
    const el = document.getElementById('t' + i);
    el.addEventListener('targetFound', () => {
      if (current !== i) {
        showCurrent(false);
        current = i;
        vid.src = t.video;
        vid.currentTime = 0;
      }
      hint.textContent = 'Loading…'; hint.style.display = 'block';
      applySound();
      vid.play().catch(() => { soundOn = false; applySound(); vid.play().catch(() => {}); });
    });
    el.addEventListener('targetLost', () => {
      vid.pause();
      hint.textContent = 'Point at the photo'; hint.style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
